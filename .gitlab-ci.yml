stages: [validate]

default:
  tags: [alp]
  interruptible: true

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - when: never

frontend:validate:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - when: never
  stage: validate
  image: node:22-bookworm
  variables:
    NEXT_TELEMETRY_DISABLED: "1"
    NEXT_PUBLIC_BACKEND_BASE_URL: "http://localhost:8000"
  before_script:
    - cd frontend
    - npm ci --no-audit --no-fund
  script:
    - npm run lint
    - npx tsc --noEmit
    - npm run test -- --run
    - npm run build

backend:validate:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - when: never
  stage: validate
  image: python:3.12-bookworm
  variables:
    DEBUG: "True"
    SECRET_KEY: "synthetic-ci-key-never-use-for-a-running-service"
    ADMIN_ACCESS_KEY: "synthetic-ci-admin-key"
    OPENAI_API_KEY: ""
    ALLOWED_HOSTS: "localhost,127.0.0.1,testserver"
  before_script:
    - cd backend
    - python -m pip install -r requirements.txt -c constraints.txt
  script:
    - python manage.py check
    - python manage.py test

team:docs:
  stage: .pre
  image: docker.arvancloud.ir/library/node:22-bookworm
  tags: [alp]
  interruptible: true
  before_script: []
  script:
    - node scripts/check-team-docs.mjs
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - README*.md
        - docs/**/*
        - .gitlab/issue_templates/**/*
        - .gitlab/merge_request_templates/**/*
        - scripts/check-team-docs.mjs
    - when: never

# Verify local onboarding helpers without starting applications or external services.
team:onboarding:
  stage: .pre
  image: docker.arvancloud.ir/library/node:22-bookworm
  tags:
  - alp
  interruptible: true
  timeout: 5m
  before_script: []
  services: []
  cache: []
  script:
  - node --test scripts/dev-doctor.test.mjs
  rules:
  - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  - when: never
